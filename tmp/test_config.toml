[input]
mouse_recent_ms = 500
key_suppress_ms = 400
input_poll_ms = 50
ensure_interval_ms = 800
motion_eps = 1

[pools.shell]
name = "shell"
class = "0fbuf-shell"
min = 3
spawn_cmd = "kitty --class {class} --title {class} tmux new -A -s {session}"
reset_via_tmux = true
reset_keys = "C-c reset Enter"
on_spawn = []

[pools.scratch]
name = "scratch"
class = "0fbuf-scratch"
min = 1
spawn_cmd = "kitty --class {class} tmux new -A -s {session}"
reset_via_tmux = true
on_spawn = ["sleep 0.1 && xdotool type --window {xid} 'echo test'"]
